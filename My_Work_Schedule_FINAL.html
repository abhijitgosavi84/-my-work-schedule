<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>My Work Schedule</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:24px 18px}
header h1{margin:0;font-size:26px} header .sub{margin-top:5px;color:#d1d5db}
main{max-width:1000px;margin:auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:white;border-radius:14px;padding:15px;box-shadow:0 2px 10px #00000012}
.num{font-size:23px;font-weight:800}.lbl{font-size:12px;color:#6b7280;margin-top:3px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;background:white}
.toolbar input,.toolbar select{width:auto;min-width:160px}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.primary{background:#111827;color:white}.muted{background:#e5e7eb}
.schedule-head{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}
.event{background:white;border-radius:14px;padding:15px;margin:10px 0;box-shadow:0 2px 10px #00000012}
.row{display:flex;justify-content:space-between;gap:10px}.title{font-weight:800;font-size:17px}
.small{font-size:13px;color:#6b7280;margin-top:4px}
.badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700;background:#e5e7eb}
.paid{background:#dcfce7;color:#166534}.partial{background:#fef3c7;color:#92400e}.pending{background:#fee2e2;color:#991b1b}
.actions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
dialog{border:0;border-radius:18px;padding:0;width:min(94vw,650px);box-shadow:0 20px 70px #0008}
dialog::backdrop{background:#0008}
.form{padding:18px}.form h2{margin-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:700;margin:0 0 5px}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
.empty{text-align:center;padding:35px;color:#6b7280}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.stats .card:last-child{grid-column:1/-1}.grid{grid-template-columns:1fr}.full{grid-column:auto}.toolbar>*{flex:1;min-width:120px!important}}
</style>
</head>
<body>
<header><h1>My Work Schedule</h1><div class="sub">Dance • Zumba • Garba • Performances</div></header>
<main>
<section class="stats">
<div class="card"><div class="num" id="todayCount">0</div><div class="lbl">Today</div></div>
<div class="card"><div class="num" id="monthReceived">₹0</div><div class="lbl">Month Received</div></div>
<div class="card"><div class="num" id="pendingTotal">₹0</div><div class="lbl">Pending</div></div>
</section>

<div class="toolbar">
<input type="date" id="filterDate">
<input type="search" id="search" placeholder="Search event / customer">
<select id="filterType"><option value="">All Types</option><option>Individual</option><option>Group</option><option>Performance</option></select>
<button class="muted" onclick="clearFilters()">All</button>
</div>

<div class="schedule-head"><h2>Schedule</h2><button class="primary" onclick="openForm()">＋ Add Schedule</button></div>
<div id="list"></div>
</main>

<dialog id="dlg">
<form class="form" onsubmit="saveEvent(event)">
<h2 id="formTitle">Add Schedule</h2>
<input type="hidden" id="editId">
<div class="grid">
<div class="field"><label>Date</label><input required type="date" id="date"></div>
<div class="field"><label>Start Time</label><input required type="time" id="start"></div>
<div class="field"><label>End Time</label><input type="time" id="end"></div>
<div class="field full"><label>Event / Class Name</label><input required id="event" placeholder="Zumba / Garba / Performance"></div>
<div class="field"><label>Customer / Student Name</label><input id="customer"></div>
<div class="field"><label>Mobile Number</label><input id="mobile" type="tel"></div>
<div class="field"><label>Participants</label><input id="participants" type="number" min="1" value="1"></div>
<div class="field"><label>Type</label><select id="type"><option>Individual</option><option>Group</option><option>Performance</option></select></div>
<div class="field"><label>Total Fee (₹)</label><input id="fee" type="number" min="0" value="0"></div>
<div class="field"><label>Paid (₹)</label><input id="paid" type="number" min="0" value="0"></div>
<div class="field full"><label>Notes</label><textarea id="notes" rows="3" placeholder="Any notes..."></textarea></div>
</div>
<div class="form-actions"><button type="button" class="muted" onclick="dlg.close()">Cancel</button><button class="primary">Save Schedule</button></div>
</form>
</dialog>

<script>
const KEY="myWorkScheduleV4";
let data=JSON.parse(localStorage.getItem(KEY)||"[]");
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
function money(n){return "₹"+Number(n||0).toLocaleString("en-IN")}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function openForm(id=null){
 $("formTitle").textContent=id?"Edit Schedule":"Add Schedule";
 $("editId").value=id||"";
 let x=id?data.find(a=>a.id===id):null;
 $("date").value=x?.date||today(); $("start").value=x?.start||"";
 $("end").value=x?.end||""; $("event").value=x?.event||"";
 $("customer").value=x?.customer||""; $("mobile").value=x?.mobile||"";
 $("participants").value=x?.participants||1; $("type").value=x?.type||"Individual";
 $("fee").value=x?.fee||0; $("paid").value=x?.paid||0; $("notes").value=x?.notes||"";
 dlg.showModal();
}
function saveEvent(e){
 e.preventDefault();
 let id=$("editId").value||crypto.randomUUID();
 let x={id,date:$("date").value,start:$("start").value,end:$("end").value,event:$("event").value.trim(),customer:$("customer").value.trim(),mobile:$("mobile").value.trim(),participants:$("participants").value,type:$("type").value,fee:Number($("fee").value||0),paid:Number($("paid").value||0),notes:$("notes").value.trim()};
 let i=data.findIndex(a=>a.id===id); if(i>=0)data[i]=x;else data.push(x);
 data.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
 save(); dlg.close();
}
function removeEvent(id){if(confirm("Delete this schedule?")){data=data.filter(x=>x.id!==id);save()}}
function clearFilters(){$("filterDate").value="";$("search").value="";$("filterType").value="";render()}
function render(){
 let d=$("filterDate").value,q=$("search").value.toLowerCase(),t=$("filterType").value;
 let arr=data.filter(x=>(!d||x.date===d)&&(!t||x.type===t)&&(!q||(x.event+" "+x.customer+" "+x.notes).toLowerCase().includes(q)));
 let now=new Date(), ym=now.toISOString().slice(0,7), td=today();
 $("todayCount").textContent=data.filter(x=>x.date===td).length;
 $("monthReceived").textContent=money(data.filter(x=>x.date.startsWith(ym)).reduce((s,x)=>s+Number(x.paid||0),0));
 $("pendingTotal").textContent=money(data.reduce((s,x)=>s+Math.max(0,Number(x.fee||0)-Number(x.paid||0)),0));
 $("list").innerHTML=arr.length?arr.map(x=>{
   let due=Math.max(0,Number(x.fee||0)-Number(x.paid||0));
   let status=due<=0?"Paid":Number(x.paid||0)>0?"Partial":"Pending";
   let cls=status.toLowerCase();
   return `<div class="event">
   <div class="row"><div><div class="title">${esc(x.event)}</div><div class="small">${x.date} • ${x.start||""}${x.end?" – "+x.end:""}</div></div><span class="badge ${cls}">${status}</span></div>
   <div class="small">👤 ${esc(x.customer||"—")} &nbsp; 👥 ${x.participants||1} &nbsp; <span class="badge">${esc(x.type)}</span></div>
   <div class="small">Fee: <b>${money(x.fee)}</b> • Paid: <b>${money(x.paid)}</b> • Due: <b>${money(due)}</b></div>
   ${x.notes?`<div class="small">📝 ${esc(x.notes)}</div>`:""}
   <div class="actions">${x.mobile?`<a href="tel:${esc(x.mobile)}"><button class="muted">📞 Call</button></a>`:""}<button class="muted" onclick="openForm('${x.id}')">✏️ Edit</button><button class="muted" onclick="removeEvent('${x.id}')">🗑️ Delete</button></div>
   </div>`;
 }).join(""):`<div class="empty">No schedules found.<br><br>Tap <b>＋ Add Schedule</b> to add your first entry.</div>`;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("filterDate").onchange=render;$("search").oninput=render;$("filterType").onchange=render;
render();
</script>
</body>
</html>
