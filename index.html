<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>My Work Schedule</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#111827;color:#fff;padding:22px 18px 18px}h1{margin:0;font-size:25px}.sub{margin-top:5px;color:#d1d5db;font-size:14px}
.wrap{max-width:800px;margin:auto;padding:14px}.dash{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.card{background:#fff;border-radius:14px;padding:12px 10px;box-shadow:0 2px 10px #0000000d}.card b{display:block;font-size:19px}.card span{font-size:11px;color:#6b7280}
.add{width:100%;padding:14px;border:0;border-radius:13px;background:#111827;color:#fff;font-size:16px;font-weight:700;margin-bottom:12px}.toolbar{background:#fff;padding:11px;border-radius:14px;box-shadow:0 2px 10px #0000000d}.toolbar input,.toolbar select{margin-bottom:8px}
input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;background:#fff;font-size:15px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin-bottom:10px}.field label{display:block;font-size:13px;font-weight:650;margin-bottom:5px}
h2{font-size:19px;margin:18px 2px 9px}.entry{background:#fff;border-radius:15px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px #0000000d}.top{display:flex;justify-content:space-between;gap:8px}.title{font-size:17px;font-weight:750}.badge{background:#eef2ff;border-radius:20px;padding:5px 9px;font-size:12px;white-space:nowrap}.meta{font-size:13px;color:#4b5563;line-height:1.55;margin-top:7px}.money{font-size:13px;margin-top:8px}.actions{display:flex;gap:8px;margin-top:11px}.actions button{flex:1;padding:9px;border:1px solid #d1d5db;background:#fff;border-radius:9px;font-weight:600}.empty{text-align:center;background:#fff;border-radius:14px;padding:28px;color:#6b7280}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:15px;overflow:auto}.box{max-width:680px;margin:20px auto;background:#fff;border-radius:18px;padding:17px}.box h2{margin-top:0}.section{border-top:1px solid #e5e7eb;padding-top:13px;margin-top:12px}.student{border:1px solid #ddd;border-radius:12px;padding:11px;margin-bottom:9px;background:#fafafa}.studenthead{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}.smallbtn{border:0;background:#e5e7eb;border-radius:8px;padding:5px 8px}.buttons{display:flex;gap:9px;margin-top:14px}.buttons button{flex:1;padding:13px;border:0;border-radius:10px;font-weight:700}.save{background:#111827;color:#fff}.cancel{background:#e5e7eb}
.hidden{display:none}@media(max-width:500px){.grid2{grid-template-columns:1fr}.dash{gap:5px}.card{padding:11px 7px}}
</style>
</head>
<body>
<header><h1>My Work Schedule</h1><div class="sub">Dance • Zumba • Garba • Performances</div></header>
<div class="wrap">
<div class="dash"><div class="card"><b id="cnt">0</b><span>Total Entries</span></div><div class="card"><b id="rec">₹0</b><span>Received</span></div><div class="card"><b id="pend">₹0</b><span>Pending</span></div></div>
<button class="add" onclick="openForm()">＋ Add Class / Event / Group / Individual</button>
<div class="toolbar"><input id="search" placeholder="Search name, class, group..." oninput="render()"><div class="grid2"><select id="filter" onchange="render()"><option value="">All Types</option><option>Class</option><option>Event</option><option>Group</option><option>Individual</option></select><input id="dateFilter" type="date" onchange="render()"></div></div>
<h2>Schedule</h2><div id="list"></div>
</div>

<div class="modal" id="modal"><div class="box">
<h2 id="ft">Add New</h2>
<form id="form" onsubmit="save(event)">
<input type="hidden" id="eid">
<div class="field"><label>Primary Type</label><select id="type" required onchange="fields()"><option value="">Select</option><option>Class</option><option>Event</option><option>Group</option><option>Individual</option></select></div>
<div id="common">
<div class="field"><label id="mainLabel">Class / Event / Group / Individual Name</label><input id="mainName" required></div>
<div class="grid2"><div class="field"><label>Start Date</label><input id="start" type="date" required></div><div class="field"><label>End Date</label><input id="end" type="date" required></div></div>
</div>

<div id="classFields" class="hidden">
<div class="section"><b>Students</b><div id="students"></div><button type="button" class="smallbtn" onclick="addStudent()">＋ Add Student</button></div>
</div>

<div id="groupFields" class="hidden">
<div class="section"><b>Group Contact</b>
<div class="grid2"><div class="field"><label>Group Leader Name</label><input id="leader"></div><div class="field"><label>Contact No.</label><input id="leaderMobile" type="tel" inputmode="numeric"></div></div>
<div class="field"><label>Fee Status</label><select id="groupStatus"><option>Pending</option><option>Half Paid</option><option>Full Paid</option></select></div>
</div></div>

<div id="individualFields" class="hidden">
<div class="section"><b>Contact & Fees</b><div class="field"><label>Contact Name</label><input id="indName"></div><div class="field"><label>Contact No.</label><input id="indMobile" type="tel" inputmode="numeric"></div></div>
</div>

<div id="feeFields" class="section">
<div class="grid2"><div class="field"><label>Total Fees (₹)</label><input id="total" type="number" min="0" value="0"></div><div class="field"><label>Paid (₹)</label><input id="paid" type="number" min="0" value="0"></div></div>
</div>
<div class="field"><label>Notes</label><textarea id="notes" rows="3" placeholder="Batch timing, venue, songs, etc."></textarea></div>
<div class="buttons"><button type="button" class="cancel" onclick="closeForm()">Cancel</button><button class="save">Save</button></div>
</form></div></div>

<script>
const KEY="myWorkScheduleV6";let data=JSON.parse(localStorage.getItem(KEY)||"[]");
const $=x=>document.getElementById(x), today=()=>new Date().toISOString().slice(0,10), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
function money(n){return "₹"+Number(n||0).toLocaleString("en-IN")}
function openForm(id){$("modal").style.display="block";$("form").reset();$("eid").value="";$("students").innerHTML="";if(id){let e=data.find(x=>x.id===id);$("ft").textContent="Edit Entry";$("eid").value=e.id;$("type").value=e.type;$("mainName").value=e.mainName;$("start").value=e.start;$("end").value=e.end;$("total").value=e.total;$("paid").value=e.paid;$("notes").value=e.notes||"";fields();$("leader").value=e.leader||"";$("leaderMobile").value=e.leaderMobile||"";$("groupStatus").value=e.groupStatus||"Pending";$("indName").value=e.indName||"";$("indMobile").value=e.indMobile||"";(e.students||[]).forEach(s=>addStudent(s))}else{$("ft").textContent="Add New";$("start").value=today();$("end").value=today();fields()}}
function closeForm(){$("modal").style.display="none"}
function fields(){let t=$("type").value;$("classFields").classList.toggle("hidden",t!=="Class");$("groupFields").classList.toggle("hidden",t!=="Group");$("individualFields").classList.toggle("hidden",t!=="Individual");$("mainLabel").textContent=t==="Class"?"Class Name":t==="Event"?"Event Name":t==="Group"?"Group Name":t==="Individual"?"Individual Name":"Class / Event / Group / Individual Name";if(t==="Class"&&!$("students").children.length)addStudent()}
function addStudent(s={}){let n=$("students").children.length+1,d=document.createElement("div");d.className="student";d.innerHTML=`<div class="studenthead"><span>Student ${n}</span><button type="button" class="smallbtn" onclick="this.closest('.student').remove()">Remove</button></div><div class="field"><label>Student Name</label><input class="sname" value="${esc(s.name||"")}"></div><div class="grid2"><div class="field"><label>Join Date</label><input class="sjoin" type="date" value="${s.join||""}"></div><div class="field"><label>Fees Paid (₹)</label><input class="spaid" type="number" min="0" value="${s.paid||0}"></div></div><div class="field"><label>Fees Pending (₹)</label><input class="spending" type="number" min="0" value="${s.pending||0}"></div>`;$("students").appendChild(d)}
function save(ev){ev.preventDefault();let t=$("type").value,e={id:$("eid").value||uid(),type:t,mainName:$("mainName").value.trim(),start:$("start").value,end:$("end").value,total:Number($("total").value||0),paid:Number($("paid").value||0),notes:$("notes").value.trim(),leader:$("leader").value,leaderMobile:$("leaderMobile").value,groupStatus:$("groupStatus").value,indName:$("indName").value,indMobile:$("indMobile").value,students:[]};if(t==="Class")document.querySelectorAll(".student").forEach(x=>e.students.push({name:x.querySelector(".sname").value,join:x.querySelector(".sjoin").value,paid:Number(x.querySelector(".spaid").value||0),pending:Number(x.querySelector(".spending").value||0)}));if(e.paid>e.total)e.paid=e.total;let i=data.findIndex(x=>x.id===e.id);if(i>=0)data[i]=e;else data.push(e);localStorage.setItem(KEY,JSON.stringify(data));closeForm();render()}
function del(id){if(confirm("Delete this entry?")){data=data.filter(x=>x.id!==id);localStorage.setItem(KEY,JSON.stringify(data));render()}}
function call(n){if(n)location.href="tel:"+n}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function render(){let q=$("search").value.toLowerCase(),ft=$("filter").value,fd=$("dateFilter").value,a=data.filter(e=>(!q||JSON.stringify(e).toLowerCase().includes(q))&&(!ft||e.type===ft)&&(!fd||fd>=e.start&&fd<=e.end));$("cnt").textContent=data.length;$("rec").textContent=money(data.reduce((s,e)=>s+e.paid,0));$("pend").textContent=money(data.reduce((s,e)=>s+Math.max(0,e.total-e.paid),0));if(!a.length){$("list").innerHTML='<div class="empty">No schedules found.<br><br>Tap <b>＋ Add Class / Event / Group / Individual</b></div>';return}a.sort((x,y)=>x.start.localeCompare(y.start));$("list").innerHTML=a.map(e=>{let people=e.students?.length?`<div class="meta"><b>Students:</b> ${e.students.map(s=>esc(s.name)||"Unnamed").join(", ")}</div>`:"";let contact=e.type==="Group"?`Leader: ${esc(e.leader)}${e.leaderMobile?" • "+esc(e.leaderMobile):""}`:e.type==="Individual"?`${esc(e.indName)}${e.indMobile?" • "+esc(e.indMobile):""}`:"";return `<div class="entry"><div class="top"><div class="title">${esc(e.mainName)}</div><div class="badge">${esc(e.type)}</div></div><div class="meta">📅 ${e.start} → ${e.end}${contact?"<br>👤 "+contact:""}</div>${people}<div class="money">Total: ${money(e.total)} • Paid: ${money(e.paid)} • <b>Pending: ${money(Math.max(0,e.total-e.paid))}</b></div>${e.type==="Group"?`<div class="meta">Fee status: ${esc(e.groupStatus)}</div>`:""}${e.notes?`<div class="meta">📝 ${esc(e.notes)}</div>`:""}<div class="actions"><button onclick="openForm('${e.id}')">Edit</button>${(e.leaderMobile||e.indMobile)?`<button onclick="call('${e.leaderMobile||e.indMobile}')">Call</button>`:""}<button onclick="del('${e.id}')">Delete</button></div></div>`}).join("")}
render();
</script>
</body>
</html>
